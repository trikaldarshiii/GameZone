<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egg Catcher Game</title>
    <link rel="stylesheet" href="bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container" class="container d-flex flex-column align-items-center justify-content-center vh-100">
        <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <h2 class="mb-3 text-center">🥚 Egg Catcher Game 🐔</h2>
            <input type="text" id="username" maxlength="12" class="form-control mb-2" placeholder="Enter username" />
            <button id="start-btn" class="btn btn-primary w-100 mb-2">Start Game</button>
            <div id="login-error" class="text-danger text-center"></div>
        </div>
    </div>
    <div id="game-container" class="container d-flex flex-column align-items-center justify-content-center" style="display:none;">
        <div class="card p-3 shadow-lg" style="max-width: 500px; width: 100%;">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div id="score-board" class="badge bg-warning text-dark fs-5">Score: 0</div>
                <button id="settings-btn" class="btn btn-outline-secondary btn-sm">Settings</button>
            </div>
            <canvas id="game-canvas" width="480" height="640" class="border rounded"></canvas>
        </div>
    </div>
    <div id="settings-container" class="container d-flex flex-column align-items-center justify-content-center" style="display:none;">
        <div class="card p-4 shadow-lg" style="max-width: 400px; width: 100%;">
            <h3 class="mb-3">Settings</h3>
            <div class="mb-2">
                <label class="form-label">Background:</label>
                <select id="background-select" class="form-select">
                    <option value="default">Default</option>
                    <option value="farm">Farm</option>
                    <option value="night">Night</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Hen:</label>
                <select id="hen-select" class="form-select">
                    <option value="funny">Funny Hen</option>
                    <option value="classic">Classic Hen</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">Basket:</label>
                <select id="basket-select" class="form-select">
                    <option value="funny">Funny Basket</option>
                    <option value="classic">Classic Basket</option>
                </select>
            </div>
            <button id="close-settings" class="btn btn-secondary w-100 mt-2">Close</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
